name: CI

on:
    push:
        branches:
            - main
            - next
        paths-ignore:
            - ".changeset/**"
            - ".vscode/**"
            - CHANGELOG.md
    pull_request:
        paths-ignore:
            - ".changeset/**"
            - ".vscode/**"
            - CHANGELOG.md

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: true

jobs:
    quality:
        name: Typecheck, test, build, and package
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --prefer-offline

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build package
              run: pnpm build

            - name: Verify packed consumers
              run: pnpm verify:package

            - name: Validate documentation links
              run: pnpm --filter @trakoo/docs exec blume validate --strict

            - name: Build documentation
              run: pnpm --filter @trakoo/docs build
